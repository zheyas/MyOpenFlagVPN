[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "openflux"
version = "0.1.0"
description = "OpenFlux (Python port) — pluggable-transport L4 tunnel"
requires-python = ">=3.9"
dependencies = [
    "aiohttp>=3.9",
    "zstandard>=0.22",
    "cryptography>=42.0",
]

[project.optional-dependencies]
oneme = ["lz4>=4.0"]

[project.scripts]
openflux = "openflux.cli:main"

[tool.setuptools.packages.find]
include = ["openflux*"]
